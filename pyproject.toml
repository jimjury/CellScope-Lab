[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellscope-lab"
version = "0.2.0"
description = "Auditable battery SOC, SOH and RUL benchmarking with an interactive research atlas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3"]

[project.optional-dependencies]
neural = ["torch>=2.1"]
ml = ["scikit-learn>=1.3,<2"]
all = ["torch>=2.1", "scikit-learn>=1.3,<2"]
test = ["pytest>=8"]

[project.scripts]
cellscope = "cellscope.cli:main"

[tool.setuptools.packages.find]
include = ["cellscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
