name: Publish CellScope Lab web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cellscope-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Audit and deploy the complete HTML workbench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify assets, controls, metrics and static HTTP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_assets.py
          node --test tests-js/*.cjs
          python3 scripts/verify_web_http.py
          test -s web/index.html
          test -s web/guide.html
          test -s web/guide.en.html
          mkdir -p dist
          cp -a web/. dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/assets/app.js
          test -s dist/assets/academy-ui.js
          test -s dist/assets/i18n.js
          test -s dist/assets/styles.css
          echo "Deploying verified CellScope Lab web/index.html as site root"
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
