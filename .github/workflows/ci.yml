name: Python and JavaScript checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test,neural]'
      - run: python -m pytest -q
      - run: node --test tests-js/*.cjs
      - run: python scripts/verify_assets.py
